# AEROSPACE CONFIG
#https://github.com/edunfelt/base16-rose-pine-scheme/blob/main/assets/palette.png
start-at-login = true

after-login-command = []

after-startup-command = [
     'exec-and-forget /opt/homebrew/opt/borders/bin/borders active_color=0xFFFFBE69 inactive_color=0xFF007692 width=8.0',
     'exec-and-forget /bin/bash -lc "~/.config/aerospace/populate_workspaces.sh"'
#     'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar'
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_changed FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center'
]

on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget /bin/bash -c /opt/homebrew/bin/sketchybar --trigger front_app_switched',
  'exec-and-forget sketchybar --trigger update_windows'
]

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

[gaps]
#outer.bottom numbers have to match presentation.sh variables. built-in retina display is excluded from presentation mode, so this only works on external monitors.
outer.bottom =        [{monitor.'^built-in retina display$' = 20 }, 40]
outer.top =        [{monitor.'^built-in retina display$' = 30 }, 82]
outer.left =       40
outer.right =      40
inner.horizontal = 40
inner.vertical =   40

[exec]                   # Again, you don't need to copy all config sections to your config.
inherit-env-vars = true  # If you don't touch "exec" section,
[exec.env-vars]          # it will fallback to "default-config.toml"
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[mode.main.binding]
# Hyper key modifier hierarchy (Caps Lock = Hyper):
# cmd-ctrl              → Navigation (focus windows/workspaces)
# cmd-ctrl-shift        → Window movement (move windows in current workspace)
# cmd-ctrl-alt-shift    → Workspace movement (move windows to workspaces)
# cmd-ctrl-alt          → Alternative actions (layout toggle)
# cmd-ctrl-letter       → Window actions & mode entry
# alt                   → Splitting actions (separate domain)
#
# Note: Caps Lock is remapped to cmd+ctrl via Karabiner-Elements
# This eliminates conflicts with native macOS shortcuts

# Quick resize
cmd-ctrl-keypadMinus = 'resize smart -70'
cmd-ctrl-keypadPlus = 'resize smart +70'

# Mode entry
cmd-ctrl-r = [
  'mode resize',
  'exec-and-forget sketchybar --trigger send_message MESSAGE="RESIZE MODE" HOLD="true"'
]

cmd-ctrl-g = [
   'mode join',
   'exec-and-forget sketchybar --trigger send_message MESSAGE="JOIN MODE" HOLD="true"'
]

# Window actions
cmd-ctrl-f = 'fullscreen'
cmd-ctrl-shift-f = 'macos-native-fullscreen'
cmd-ctrl-alt-space = 'layout floating tiling'

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

#cmd-ctrl-enter = 'exec-and-forget open -n /Volumes/Macintosh\ HD/Applications/Alacritty.app'
cmd-ctrl-enter = 'exec-and-forget open -n /Volumes/Macintosh\ HD/Applications/Ghostty.app'
#cmd-ctrl-m = 'exec-and-forget open -n /Volumes/Macintosh\ HD/Applications/Marta.app'

# Splitting (separate domain using alt)
alt-g = 'split horizontal'
alt-v = 'split vertical'

# Navigation: Focus windows (cmd-ctrl)
cmd-ctrl-h = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
cmd-ctrl-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
cmd-ctrl-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
cmd-ctrl-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'
cmd-ctrl-left = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
cmd-ctrl-down = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
cmd-ctrl-up = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
cmd-ctrl-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'

# Movement: Move windows (cmd-ctrl-shift)
cmd-ctrl-shift-h = 'move left'
cmd-ctrl-shift-j = 'move down'
cmd-ctrl-shift-k = 'move up'
cmd-ctrl-shift-l = 'move right'
cmd-ctrl-shift-left = 'move left'
cmd-ctrl-shift-down = 'move down'
cmd-ctrl-shift-up = 'move up'
cmd-ctrl-shift-right = 'move right'

# Navigation: Workspaces (cmd-ctrl+number)
cmd-ctrl-1 = 'workspace --auto-back-and-forth 1'  # Browser
cmd-ctrl-2 = 'workspace --auto-back-and-forth 2'  # Messaging (Slack + WhatsApp)
cmd-ctrl-3 = 'workspace --auto-back-and-forth 3'  # Calendar
cmd-ctrl-4 = 'workspace --auto-back-and-forth 4'  # Mail
cmd-ctrl-5 = 'workspace --auto-back-and-forth 5'  # Obsidian
cmd-ctrl-6 = 'workspace --auto-back-and-forth 6'  # Figma
cmd-ctrl-7 = 'workspace --auto-back-and-forth 7'  # Code
cmd-ctrl-8 = 'workspace --auto-back-and-forth 8'  # Misc

# Movement: Move windows to workspaces (cmd-ctrl-alt-shift+number)
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'

# Navigation: Workspace switching
cmd-ctrl-tab = 'workspace-back-and-forth'

# Monitor management
cmd-ctrl-p = 'move-workspace-to-monitor --wrap-around next'
cmd-ctrl-shift-p = [
  'move-node-to-monitor --wrap-around next',
  'focus-monitor next --wrap-around'
]
cmd-ctrl-alt-h = []

# Service mode entry
cmd-ctrl-shift-s = [
  'mode service',
  'exec-and-forget sketchybar --trigger send_message MESSAGE="SERVICE MODE" HOLD="true"'
]

[mode.service.binding]
esc = [
 'reload-config',
 'exec-and-forget sketchybar --trigger hide_message',
 'exec-and-forget sketchybar --reload',
 'mode main'
]
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2

s = [
    'exec-and-forget cat ~/.config/aerospace/shrugstring| pbcopy',
   'exec-and-forget sketchybar --trigger hide_message',
   'mode main'
] 

b = [
   'exec-and-forget ~/.config/aerospace/presentation.sh on',
   'exec-and-forget sketchybar --bar height=0',
   'exec-and-forget sketchybar --trigger hide_message',
   'mode main'
]
shift-b = [
   'exec-and-forget ~/.config/aerospace/presentation.sh off',
   'exec-and-forget sketchybar --bar height=36',
   'exec-and-forget sketchybar --trigger hide_message',
   'mode main'
]

backspace = ['close-all-windows-but-current', 'mode main']

[mode.resize.binding]
keypadMinus = 'resize smart -70'
keypadPlus = 'resize smart +70'
h = ['resize width -64']
j = ['resize height -64']
k = ['resize height +64']
l = ['resize width +64']
esc = [
  'mode main',
  'exec-and-forget sketchybar --trigger hide_message'
]
enter = [
  'mode main',
  'exec-and-forget sketchybar --trigger hide_message'
]

[mode.join.binding]
h = ['join-with left', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
j = ['join-with down', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
k = ['join-with up', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
l = ['join-with right', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
cmd-ctrl-h = ['join-with left', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
cmd-ctrl-alt-h = ['join-with left', 'mode main', 'exec-and-forget sketchybar --trigger hide_message']
esc = [
  'mode main',
  'exec-and-forget sketchybar --trigger hide_message'
]
enter = [
  'mode main',
  'exec-and-forget sketchybar --trigger hide_message'
]

[[on-window-detected]]
if.window-title-regex-substring = '(close tab|save|open|alert|confirm|password|authentication|login|sign in|delete|remove|warning|error|permission|access|allow|block|quit|exit|dialog|sheet|panel)'
run = []
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'company.thebrowser.dia'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.qutebrowser.qutebrowser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.cron.electron'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.superhuman.electron'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.figma.Desktop'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'dev.warp.Warp-Stable'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'pl.maketheweb.cleanshotx'
run = []

[[on-window-detected]]
if.app-id = 'so.cap.desktop'
run = []

[[on-window-detected]]
run = 'move-node-to-workspace 8'
