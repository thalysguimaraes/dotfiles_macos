# Yazi config — terminal file manager
# Reference: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1000
max_height      = 1000
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', desc = "open (macOS)", for = "macos" },
  { run = 'xdg-open "$@"', desc = "xdg-open (linux)", for = "linux" },
]
reveal = [
  { run = 'open -R "$1"', desc = "reveal in Finder", for = "macos" },
  { run = 'xdg-open "$(dirname "$1")"', desc = "reveal", for = "linux" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "extract here" },
]

[open]
rules = [
  { mime = "text/*",                                         use = ["edit", "reveal"] },
  { mime = "application/{json,javascript,toml,yaml,xml}*",   use = ["edit", "reveal"] },
  { mime = "application/x-{shellscript,sh,zsh}*",            use = ["edit", "reveal"] },
  { mime = "image/*",                                        use = ["open", "reveal"] },
  { mime = "video/*",                                        use = ["open", "reveal"] },
  { mime = "audio/*",                                        use = ["open", "reveal"] },
  { mime = "application/pdf",                                use = ["open", "reveal"] },
  { mime = "application/zip",                                use = ["extract", "reveal", "open"] },
  { mime = "application/x-7z-compressed",                    use = ["extract", "reveal", "open"] },
  { mime = "application/x-tar",                              use = ["extract", "reveal", "open"] },
  { mime = "application/gzip",                               use = ["extract", "reveal", "open"] },
  { mime = "inode/directory",                                use = ["open", "reveal"] },
  { mime = "*",                                              use = ["open", "reveal"] },
]
